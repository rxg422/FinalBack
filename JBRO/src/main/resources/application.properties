spring.application.name=JBRO

# =========================================================
# 공통 설정 파일
# ---------------------------------------------------------
# 이 파일은 GitHub에 올라가는 공통 설정 파일입니다.
# DB 주소, DB 아이디, DB 비밀번호, 포트, API 키처럼
# 팀원마다 다르거나 외부에 공개되면 안 되는 값은 여기에 작성하지 않습니다.
#
# 개인 설정은 application-local.properties에 작성합니다.
# application-local.properties는 .gitignore에 등록되어 있으므로
# GitHub에 올라가지 않습니다.
# =========================================================

# ---------------------------------------------------------
# 로컬 전용 설정 불러오기
# ---------------------------------------------------------
# optional:
# - application-local.properties 파일이 없어도 서버 실행을 시도합니다.
#
# classpath:
# - src/main/resources 폴더 안에서 application-local.properties를 찾습니다.
#
# 팀원 설정 방법:
# - application-local.example.properties 파일을 복사합니다.
# - 파일명을 application-local.properties로 변경합니다.
# - 본인의 DB 접속 정보, 포트, API 키 등을 입력합니다.
spring.config.import=optional:classpath:application-local.properties

# ---------------------------------------------------------
# 로그 설정
# ---------------------------------------------------------
# com.jbro 패키지에서 발생하는 로그를 debug 수준까지 출력합니다.
logging.level.com.jbro=debug

# ---------------------------------------------------------
# 파일 업로드 설정
# ---------------------------------------------------------
# 프로필 이미지 업로드 시 허용할 최대 파일 크기입니다.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------
# MyBatis 설정
# ---------------------------------------------------------
# mapper XML 파일 위치입니다.
mybatis.mapper-locations=classpath*:/mapper/**/*.xml

# DB 조회 결과의 snake_case 컬럼명을 Java의 camelCase 필드명으로 자동 매핑합니다.
# 예: created_at -> createdAt
mybatis.configuration.map-underscore-to-camel-case=true

# DB에 null 값을 넣거나 조회할 때 JDBC 타입을 NULL로 처리합니다.
mybatis.configuration.jdbc-type-for-null=NULL

# MyBatis에서 VO, DTO 클래스 alias를 찾을 기본 패키지입니다.
mybatis.type-aliases-package=com.jbro

# ---------------------------------------------------------
# JWT 설정
# ---------------------------------------------------------
# 실제 JWT secret 값은 application-local.properties에 작성합니다.
# 아래 기본값은 로컬 설정 파일이 없을 때 서버 실행을 막지 않기 위한 개발용 값입니다.
jwt.secret=${JWT_SECRET:ZGV2LWp3dC1zZWNyZXQtZm9yLWxvY2FsLXRlc3QtMzItYnl0ZXMtMTIzNDU2}
jwt.refresh-secret=${JWT_REFRESH_SECRET:ZGV2LWp3dC1yZWZyZXNoLXNlY3JldC1mb3ItbG9jYWwtdGVzdC0zMi1ieXRlcw==}

# ---------------------------------------------------------
# Kakao OAuth 설정
# ---------------------------------------------------------
# 실제 client-id와 client-secret은 application-local.properties에 작성합니다.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:local-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image

# Kakao OAuth 제공자 정보입니다.
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
