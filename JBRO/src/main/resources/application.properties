spring.application.name=JBRO

# =========================================================
# 공통 설정 파일
# ---------------------------------------------------------
# 이 파일은 GitHub에 올라가는 공통 설정 파일입니다.
# DB 주소, DB 아이디, DB 비밀번호, 포트, API 키처럼
# 팀원마다 다르거나 외부에 공개되면 안 되는 값은 여기에 작성하지 않습니다.
#
# 개인 설정은 application-local.properties에 작성합니다.
# application-local.properties는 .gitignore에 등록되어 있으므로
# GitHub에 올라가지 않습니다.
# =========================================================

# ---------------------------------------------------------
# 로컬 전용 설정 불러오기
# ---------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

# ---------------------------------------------------------
# 로그 설정
# ---------------------------------------------------------
logging.level.com.jbro=debug

# JPA SQL 로그 설정
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# ---------------------------------------------------------
# 파일 업로드 설정
# ---------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------
# Server 설정
# ---------------------------------------------------------
server.port=8081

# ---------------------------------------------------------
# JPA/Hibernate 설정
# ---------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------
# H2 설정
# ---------------------------------------------------------
spring.h2.console.enabled=false

# ---------------------------------------------------------
# 프론트엔드 연동 설정
# ---------------------------------------------------------
app.frontend.oauth-callback-url=${FRONTEND_OAUTH_CALLBACK_URL:http://localhost:3000/oauth2/callback}

# ---------------------------------------------------------
# MyBatis 설정
# ---------------------------------------------------------
mybatis.mapper-locations=classpath*:/mapper/**/*.xml

# snake_case -> camelCase 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# null 처리
mybatis.configuration.jdbc-type-for-null=NULL

# type alias 패키지
mybatis.type-aliases-package=com.jbro

# ---------------------------------------------------------
# Kakao OAuth 설정
# ---------------------------------------------------------
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:local-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image

# ---------------------------------------------------------
# Google OAuth 설정
# ---------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-client-secret}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.scope=profile,email

# ---------------------------------------------------------
# Naver OAuth 설정
# ---------------------------------------------------------
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:local-naver-client-id}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:local-naver-client-secret}
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.naver.scope=profile,email

# ---------------------------------------------------------
# Kakao Provider 설정
# ---------------------------------------------------------
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ---------------------------------------------------------
# Google Provider 설정
# ---------------------------------------------------------
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ---------------------------------------------------------
# Naver Provider 설정
# ---------------------------------------------------------
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ---------------------------------------------------------
# AI API Key 설정
# ---------------------------------------------------------
xai.api.key=${XAI_API_KEY:}
xai.api.url=https://api.x.ai/v1/chat/completions
tavily.api.key=${TAVILY_API_KEY:}