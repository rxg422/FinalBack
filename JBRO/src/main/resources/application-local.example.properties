# Copy this file to application-local.properties and fill in values for your local environment.

# Server
server.port=8081

# Frontend
app.frontend.oauth-callback-url=http://localhost:3000/oauth2/callback

# MySQL RDS
spring.datasource.url=jdbc:mysql://YOUR_RDS_ENDPOINT:3306/jbro?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
jwt.secret=YOUR_BASE64_JWT_SECRET
jwt.refresh-secret=YOUR_BASE64_JWT_REFRESH_SECRET

# Kakao OAuth
spring.security.oauth2.client.registration.kakao.client-id=YOUR_KAKAO_CLIENT_ID
spring.security.oauth2.client.registration.kakao.client-secret=YOUR_KAKAO_CLIENT_SECRET

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET

# Naver OAuth
spring.security.oauth2.client.registration.naver.client-id=YOUR_NAVER_CLIENT_ID
spring.security.oauth2.client.registration.naver.client-secret=YOUR_NAVER_CLIENT_SECRET

# ---------------------------------------------------------
# AI API \uC124\uC815 (Grok, Tavily)
# ---------------------------------------------------------
# Grok API Key \uC124\uC815
xai.api.key=YOUR_GROK_API_KEY
# Tavily API Key \uC124\uC815
tavily.api.key=YOUR_TAVILY_API_KEY